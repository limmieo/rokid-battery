plugins { id 'com.android.application' }
android {
    namespace 'app.rokidbattery'
    compileSdk 36
    defaultConfig {
        applicationId 'app.rokidbattery'
        minSdk 36
        targetSdk 36
        versionCode 5
        versionName '1.1.3'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.rokid.cxr:client-l:1.0.4' }
